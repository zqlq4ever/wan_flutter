name: wan_android_flutter
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.1.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  provider: ^6.1.5

  # 屏幕适配相关
  flutter_screenutil: ^5.9.3

  # 网络请求
  dio: ^5.8.0+1

  # cookie持久化
  dio_cookie_manager: ^3.2.0

  cookie_jar: ^4.0.8

  # toast提示
  oktoast: ^3.4.0

  # 获取版本信息设备信息等
  package_info_plus: ^9.0.0

  device_info_plus: ^12.3.0

  # 权限申请
  permission_handler: ^12.0.1

  # 本地化存储
  shared_preferences: ^2.5.4

  # 图片缓存加载
  cached_network_image: ^3.4.1

  # 跳转到外部应用、scheme
  url_launcher: ^6.3.2

  # 一个 Flutter 插件，允许您添加内联 webview，使用无头 webview 以及打开应用程序内浏览器窗口
  # https://github.com/pichillilorenzo/flutter_inappwebview
  flutter_inappwebview: ^6.1.5

  webview_flutter: ^4.13.1

  # 显示 html 文本内容的组件
  flutter_html: ^3.0.0

  # 下拉刷新上拉加载
  pull_to_refresh_flutter3: ^2.0.2

  # 图片选择插件 https://github.com/flutter/packages/tree/main/packages/image_picker
  image_picker: ^1.2.1

  # 处理键盘事件 https://github.com/diegoveloper/flutter_keyboard_actions
  keyboard_actions: ^4.2.1

  # Dart 常用工具类库 https://github.com/Sky24n/common_utils
  common_utils: 2.1.0

  # 路由框架 https://github.com/theyakka/fluro
  fluro: ^2.0.5

  get: ^4.7.3

  flutter_localization: ^0.3.3

  # banner 轮播图组件
  card_swiper: ^3.0.1

  marqueer: ^2.4.3

  mobile_scanner: ^7.1.4

  # https://juejin.cn/post/7508945084487401526#heading-19 推荐的框架
  extended_image: ^10.0.1
  event_bus: ^2.0.1
  uuid: ^4.5.2
  path_provider: ^2.1.5
  flutter_svg: ^2.2.3
  scroll_to_index: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/images/